# CI del frontend: se ejecuta en cada PR hacia develop o main, y el CD (cd.yml) lo
# llama como primer job de cada liberación a main.
# Sin filtro de rutas: cuando este check sea obligatorio, un workflow que no se
# ejecuta dejaría el PR esperando para siempre.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # dorny/test-reporter publica los resultados como check

jobs:
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: >-
          npm test --
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/junit.xml

      - name: Build
        run: npm run build

      - name: Publicar resultados de pruebas
        if: ${{ !cancelled() && hashFiles('test-results/*.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Resultados de pruebas (Vitest)
          path: test-results/*.xml
          reporter: java-junit

      - name: Subir reportes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
