server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Se genera al arrancar el contenedor con la configuración del ambiente:
    # el navegador no debe guardarla, o seguiría usando la URL de otra versión.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Vite agrega un hash al nombre de cada archivo de assets/: se pueden guardar
    # en caché sin límite porque un cambio genera un nombre nuevo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA: cualquier ruta del frontend (p. ej. /reservas) carga
    # index.html y React Router decide qué pantalla mostrar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
